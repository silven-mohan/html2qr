<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">QR byte-mode capacity by error-correction level</title>
  <desc id="desc">Version 40 QR code capacities are 2,953 bytes at level L, 2,331 at M, 1,663 at Q, and 1,273 at H. Higher levels provide more error correction and less payload capacity.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#172033}.heading{font-size:19px;font-weight:700}.level{font-size:15px;font-weight:700}.value{font-size:13px;font-weight:700}.small{font-size:12px;fill:#4c596b}.track{fill:#e7ebf0;stroke:#172033;stroke-width:1.5}.bar{fill:#ff4d6d;stroke:#172033;stroke-width:1.5}
  </style>
  <rect width="960" height="240" rx="14" fill="#f4f6f8"/>
  <text x="28" y="36" class="heading">Maximum payload by error correction</text>
  <text x="28" y="57" class="small">QR Code Version 40, byte mode. Larger correction level means more recovery from damage and less room for data.</text>
  <g transform="translate(28 78)">
    <text x="0" y="17" class="level">L</text><rect x="48" y="0" width="690" height="24" rx="4" class="track"/><rect x="48" y="0" width="690" height="24" rx="4" class="bar"/><text x="754" y="17" class="value">2,953 bytes · 7%</text>
    <text x="0" y="57" class="level">M</text><rect x="48" y="40" width="690" height="24" rx="4" class="track"/><rect x="48" y="40" width="544" height="24" rx="4" class="bar"/><text x="608" y="57" class="value">2,331 bytes · 15%</text>
    <text x="0" y="97" class="level">Q</text><rect x="48" y="80" width="690" height="24" rx="4" class="track"/><rect x="48" y="80" width="388" height="24" rx="4" class="bar"/><text x="452" y="97" class="value">1,663 bytes · 25%</text>
    <text x="0" y="137" class="level">H</text><rect x="48" y="120" width="690" height="24" rx="4" class="track"/><rect x="48" y="120" width="297" height="24" rx="4" class="bar"/><text x="361" y="137" class="value">1,273 bytes · 30%</text>
  </g>
  <text x="28" y="221" class="small">The app reports the selected limit and disables generation when the payload is too large.</text>
</svg>