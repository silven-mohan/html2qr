<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to put HTML in a QR code</title>
  <desc id="desc">The compressed method stores GZIP data, optionally encrypts it with AES-GCM, then Base64-encodes it in a link back to the app, which decodes it into a sandboxed viewer. The data URL method embeds minified HTML directly in the QR code.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#172033}.heading{font-size:19px;font-weight:700}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#4c596b}.tiny{font-size:11px;fill:#4c596b}.box{fill:#fff;stroke:#172033;stroke-width:2}.accent{fill:#ff4d6d;stroke:#172033;stroke-width:2}.cool{fill:#e7ebf0;stroke:#172033;stroke-width:2}.arrow{stroke:#172033;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#172033"/></marker>
  </defs>
  <rect width="960" height="360" rx="14" fill="#f4f6f8"/>
  <text x="28" y="38" class="heading">Two encoding paths</text>

  <rect x="24" y="58" width="912" height="137" rx="10" fill="#fff" stroke="#c6ccd5"/>
  <text x="42" y="84" class="label">Compressed link</text>
  <text x="42" y="104" class="small">More HTML fits; optional encryption is unlocked in the receiving browser.</text>
  <rect x="42" y="122" width="90" height="48" rx="6" class="cool"/><text x="87" y="151" text-anchor="middle" class="label">HTML</text>
  <path d="M136 146h16" class="arrow"/>
  <rect x="158" y="122" width="90" height="48" rx="6" class="box"/><text x="203" y="151" text-anchor="middle" class="label">GZIP</text>
  <path d="M252 146h16" class="arrow"/>
  <rect x="274" y="122" width="104" height="48" rx="6" class="accent"/><text x="326" y="143" text-anchor="middle" class="label">AES-GCM</text><text x="326" y="159" text-anchor="middle" class="tiny">optional</text>
  <path d="M382 146h16" class="arrow"/>
  <rect x="404" y="122" width="90" height="48" rx="6" class="box"/><text x="449" y="151" text-anchor="middle" class="label">Base64</text>
  <path d="M498 146h16" class="arrow"/>
  <rect x="520" y="122" width="144" height="48" rx="6" class="accent"/><text x="592" y="151" text-anchor="middle" class="label">HTMLQR1/2 link</text>
  <path d="M668 146h16" class="arrow"/>
  <rect x="690" y="122" width="82" height="48" rx="6" class="cool"/><text x="731" y="151" text-anchor="middle" class="label">QR</text>
  <path d="M776 146h16" class="arrow"/>
  <rect x="798" y="122" width="118" height="48" rx="6" class="box"/><text x="857" y="143" text-anchor="middle" class="label">App</text><text x="857" y="159" text-anchor="middle" class="tiny">decode + view</text>

  <rect x="24" y="211" width="912" height="125" rx="10" fill="#fff" stroke="#c6ccd5"/>
  <text x="42" y="237" class="label">Direct data URL</text>
  <text x="42" y="257" class="small">No decoder or hosting needed; the uncompressed HTML must fit.</text>
  <rect x="42" y="275" width="150" height="42" rx="6" class="cool"/><text x="117" y="301" text-anchor="middle" class="label">HTML</text>
  <path d="M196 296h38" class="arrow"/>
  <rect x="240" y="275" width="180" height="42" rx="6" class="box"/><text x="330" y="301" text-anchor="middle" class="label">Minify (optional)</text>
  <path d="M424 296h38" class="arrow"/>
  <rect x="468" y="275" width="196" height="42" rx="6" class="accent"/><text x="566" y="301" text-anchor="middle" class="label">data:text/html URL</text>
  <path d="M668 296h38" class="arrow"/>
  <rect x="712" y="275" width="112" height="42" rx="6" class="cool"/><text x="768" y="301" text-anchor="middle" class="label">QR</text>
  <text x="844" y="292" class="tiny">scan to open</text><text x="844" y="307" class="tiny">in a browser</text>
</svg>